<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CocinaNova | Productos de Cocina</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  color:#222;
}
header{
  background:#111;
  color:white;
  padding:18px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}
.logo{
  font-size:25px;
  font-weight:bold;
}
.cart{
  background:#ff6b00;
  border:0;
  color:white;
  padding:10px 15px;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
.hero{
  background:linear-gradient(135deg,#ff6b00,#ff9f43);
  color:white;
  padding:45px 20px;
  text-align:center;
}
.hero h1{font-size:38px;margin:5px 0}
.hero p{font-size:18px}
.search{
  width:90%;
  max-width:600px;
  margin:25px auto;
  display:block;
  padding:15px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}
.products{
  width:92%;
  max-width:1200px;
  margin:30px auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}
.card{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.1);
  padding-bottom:18px;
}
.product-image{
  height:190px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:75px;
}
.info{padding:15px}
.info h2{
  font-size:19px;
  margin:5px 0 10px;
}
.description{
  color:#666;
  font-size:14px;
  min-height:40px;
}
.price{
  color:#e85d04;
  font-size:24px;
  font-weight:bold;
  margin:12px 0 5px;
}
.stock{
  font-size:14px;
  color:#198754;
}
.buy{
  width:100%;
  background:#ff6b00;
  color:white;
  border:0;
  padding:12px;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
  margin-top:10px;
}
.buy:hover,.cart:hover{opacity:.9}
footer{
  background:#111;
  color:white;
  text-align:center;
  padding:30px 15px;
  margin-top:40px;
}
.whatsapp{
  display:inline-block;
  background:#25D366;
  color:white;
  text-decoration:none;
  padding:13px 20px;
  border-radius:8px;
  margin-top:10px;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:20;
}
.modal-content{
  background:white;
  width:92%;
  max-width:500px;
  margin:8% auto;
  padding:25px;
  border-radius:15px;
}
.close{
  float:right;
  font-size:25px;
  cursor:pointer;
}
.cart-item{
  border-bottom:1px solid #ddd;
  padding:10px 0;
}
.checkout{
  width:100%;
  background:#25D366;
  color:white;
  border:0;
  padding:14px;
  border-radius:8px;
  font-size:17px;
  cursor:pointer;
  margin-top:15px;
}
</style>
</head>

<body>

<header>
  <div class="logo">🍳 CocinaNova</div>
  <button class="cart" onclick="openCart()">🛒 Carrito (<span id="cartCount">0</span>)</button>
</header>

<section class="hero">
  <h1>Productos para tu Cocina</h1>
  <p>Calidad, practicidad y buenos precios en México 🇲🇽</p>
</section>

<input
  class="search"
  id="search"
  type="text"
  placeholder="🔎 Buscar producto..."
  onkeyup="searchProducts()"
>

<div class="products" id="products"></div>

<footer>
  <h2>🍳 CocinaNova</h2>
  <p>Productos prácticos para tu hogar.</p>
  <p>¿Quieres comprar? Escríbenos por WhatsApp.</p>
  <a class="whatsapp" href="https://wa.me/525516490617" target="_blank">
    💬 WhatsApp: 55 1649 0617
  </a>
  <p style="margin-top:25px;">© 2026 CocinaNova</p>
</footer>

<div class="modal" id="cartModal">
  <div class="modal-content">
    <span class="close" onclick="closeCart()">×</span>
    <h2>🛒 Mi Carrito</h2>
    <div id="cartItems"></div>
    <h3>Total: $<span id="cartTotal">0</span> MXN</h3>
    <button class="checkout" onclick="checkoutWhatsApp()">
      💬 Comprar por WhatsApp
    </button>
  </div>
</div>

<script>

const products = [
{
name:"Set 12 Utensilios de Silicona",
price:199,
stock:20,
emoji:"🥄",
description:"Set práctico de utensilios de silicona para cocinar."
},
{
name:"Set 34 Utensilios de Cocina",
price:299,
stock:20,
emoji:"🍴",
description:"Juego completo para preparar diferentes comidas."
},
{
name:"Rallador y Cortador 8 Cuchillas",
price:199,
stock:20,
emoji:"🥕",
description:"Corta, ralla y prepara verduras fácilmente."
},
{
name:"Escurridor de Trastes 2 Niveles",
price:299,
stock:20,
emoji:"🍽️",
description:"Organiza platos, vasos y utensilios de cocina."
},
{
name:"Juego de Sartenes Antiadherentes",
price:499,
stock:20,
emoji:"🍳",
description:"Sartenes prácticas con superficie antiadherente."
},
{
name:"Báscula Digital de Cocina",
price:249,
stock:20,
emoji:"⚖️",
description:"Pesa ingredientes con precisión para tus recetas."
},
{
name:"Tijeras de Cocina Multiusos",
price:129,
stock:20,
emoji:"✂️",
description:"Tijeras resistentes para diferentes tareas de cocina."
},
{
name:"Set de Utensilios de Bambú",
price:149,
stock:20,
emoji:"🥢",
description:"Utensilios de bambú para cocinar y servir."
},
{
name:"Mezcladora para Fregadero",
price:249,
stock:20,
emoji:"🚰",
description:"Accesorio práctico para mejorar tu fregadero."
},
{
name:"Grifo de Cocina Extraíble",
price:299,
stock:20,
emoji:"🚿",
description:"Grifo moderno con manguera extraíble."
}
];

let cart=[];

function showProducts(list=products){

const container=document.getElementById("products");

container.innerHTML="";

list.forEach((p,index)=>{

container.innerHTML+=`

<div class="card">

<div class="product-image">
${p.emoji}
</div>

<div class="info">

<h2>${p.name}</h2>

<div class="description">
${p.description}
</div>

<div class="price">
$${p.price} MXN
</div>

<div class="stock">
Stock disponible: ${p.stock}
</div>

<button class="buy" onclick="addToCart(${index})">
🛒 Agregar al carrito
</button>

</div>

</div>

`;

});

}

function addToCart(index){

const product=products[index];

const existing=cart.find(item=>item.name===product.name);

if(existing){

existing.quantity++;

}else{

cart.push({
name:product.name,
price:product.price,
quantity:1
});

}

updateCart();

alert("Producto agregado al carrito ✅");

}

function updateCart(){

let count=0;
let total=0;

cart.forEach(item=>{

count+=item.quantity;
total+=item.price*item.quantity;

});

document.getElementById("cartCount").innerText=count;

document.getElementById("cartTotal").innerText=total;

let html="";

if(cart.length===0){

html="<p>Tu carrito está vacío.</p>";

}else{

cart.forEach((item,index)=>{

html+=`

<div class="cart-item">

<strong>${item.name}</strong>

<br>

$${item.price} × ${item.quantity}

<button onclick="removeItem(${index})">
❌
</button>

</div>

`;

});

}

document.getElementById("cartItems").innerHTML=html;

}

function removeItem(index){

cart.splice(index,1);

updateCart();

}

function openCart(){

document.getElementById("cartModal").style.display="block";

updateCart();

}

function closeCart(){

document.getElementById("cartModal").style.display="none";

}

function checkoutWhatsApp(){

if(cart.length===0){

alert("Tu carrito está vacío.");

return;

}

let message="Hola CocinaNova 👋%0A%0AQuiero comprar:%0A";

let total=0;

cart.forEach(item=>{

let subtotal=item.price*item.quantity;

total+=subtotal;

message+=`%0A• ${item.name} x${item.quantity} = $${subtotal} MXN`;

});

message+=`%0A%0ATotal: $${total} MXN`;

message+="%0A%0A¿Me pueden confirmar disponibilidad y entrega?";

window.open(
"https://wa.me/525516490617?text="+message,
"_blank"
);

}

function searchProducts(){

const text=document
.getElementById("search")
.value
.toLowerCase();

const filtered=products.filter(p=>
p.name.toLowerCase().includes(text)
);

showProducts(filtered);

}

showProducts();

</script>

</body>
</html>
