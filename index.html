];

let cart=[];


function showProducts(list=products){

const container=document.getElementById("products");

container.innerHTML="";

list.forEach((p,index)=>{

container.innerHTML+=`

<div class="card">

<img
class="photo"
src="${p.image}"
alt="${p.name}"
onerror="this.style.display='none'"
>

<div class="info">

<h2>${p.name}</h2>

<div class="description">
${p.description}
</div>

<div class="price">
$${p.price} MXN
</div>

<div class="stock">
📦 Stock disponible: ${p.stock}
</div>

<button
class="buy"
onclick="addToCart(${index})"
>
🛒 Agregar al carrito
</button>

</div>

</div>

`;

});

}


function addToCart(index){

const product=products[index];

if(product.stock<=0){

alert("Producto agotado.");

return;

}

const existing=cart.find(
item=>item.name===product.name
);

if(existing){

existing.quantity++;

}else{

cart.push({

name:product.name,

price:product.price,

quantity:1

});

}

updateCart();

alert("Producto agregado al carrito ✅");

}


function updateCart(){

let count=0;

let total=0;

cart.forEach(item=>{

count+=item.quantity;

total+=item.price*item.quantity;

});

document.getElementById("cartCount").innerText=count;

document.getElementById("cartTotal").innerText=total;

let html="";

if(cart.length===0){

html="<p>Tu carrito está vacío.</p>";

}else{

cart.forEach((item,index)=>{

html+=`

<div class="cart-item">

<strong>${item.name}</strong>

<br>

$${item.price} × ${item.quantity}

<button onclick="removeItem(${index})">
❌
</button>

</div>

`;

});

}

document.getElementById("cartItems").innerHTML=html;

}


function removeItem(index){

cart.splice(index,1);

updateCart();

}


function openCart(){

document.getElementById("cartModal").style.display="block";

updateCart();

}


function closeCart(){

document.getElementById("cartModal").style.display="none";

}


function checkoutWhatsApp(){

if(cart.length===0){

alert("Tu carrito está vacío.");

return;

}

let message=
"Hola CocinaNova 👋%0A%0AQuiero comprar:%0A";

let total=0;

cart.forEach(item=>{

let subtotal=item.price*item.quantity;

total+=subtotal;

message+=
`%0A• ${item.name} x${item.quantity} = $${subtotal} MXN`;

});

message+=
`%0A%0ATotal: $${total} MXN`;

message+=
"%0A%0A¿Me pueden confirmar disponibilidad y entrega?";

window.open(
"https://wa.me/525516490617?text="+message,
"_blank"
);

}


function searchProducts(){

const text=
document.getElementById("search")
.value
.toLowerCase();

const filtered=
products.filter(p=>
p.name.toLowerCase().includes(text)
);

showProducts(filtered);

}


showProducts();
