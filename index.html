<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CocinaNova | Productos de Cocina</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  color:#222;
}
header{
  background:#ff6b00;
  color:white;
  padding:18px 15px;
  text-align:center;
}
.logo{
  font-size:30px;
  font-weight:bold;
}
header p{margin-top:5px}

.hero{
  background:white;
  text-align:center;
  padding:30px 15px;
}
.hero h1{
  font-size:30px;
  margin-bottom:10px;
}
.hero p{
  color:#666;
  margin-bottom:20px;
}

.search{
  width:90%;
  max-width:600px;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 15px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.product{
  background:white;
  border-radius:15px;
  padding:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  text-align:center;
}

.product-image{
  height:170px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff4ec;
  border-radius:12px;
  font-size:75px;
  margin-bottom:15px;
}

.product h3{
  font-size:18px;
  min-height:45px;
}

.description{
  color:#666;
  font-size:14px;
  margin:8px 0;
}

.price{
  color:#ff6b00;
  font-size:24px;
  font-weight:bold;
  margin:10px 0;
}

.stock{
  color:#16803c;
  font-size:14px;
  margin-bottom:10px;
}

button{
  border:none;
  cursor:pointer;
}

.add{
  background:#ff6b00;
  color:white;
  padding:12px;
  width:100%;
  border-radius:9px;
  font-size:16px;
  font-weight:bold;
}

.add:hover{
  background:#e85f00;
}

.cart-button{
  position:fixed;
  right:15px;
  bottom:15px;
  background:#111;
  color:white;
  padding:15px 20px;
  border-radius:30px;
  font-weight:bold;
  z-index:10;
}

.cart{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:20;
}

.cart-box{
  background:white;
  width:92%;
  max-width:500px;
  max-height:85vh;
  overflow:auto;
  margin:40px auto;
  padding:20px;
  border-radius:15px;
}

.cart-box h2{
  margin-bottom:15px;
}

.cart-item{
  border-bottom:1px solid #ddd;
  padding:10px 0;
}

.close{
  float:right;
  background:#ddd;
  padding:7px 12px;
  border-radius:7px;
}

.total{
  font-size:22px;
  font-weight:bold;
  margin:20px 0;
}

.whatsapp{
  display:block;
  background:#25D366;
  color:white;
  text-align:center;
  padding:14px;
  border-radius:9px;
  text-decoration:none;
  font-weight:bold;
}

footer{
  margin-top:30px;
  background:#222;
  color:white;
  text-align:center;
  padding:25px 15px;
}

footer a{
  color:#25D366;
  text-decoration:none;
}
</style>
</head>

<body>

<header>
  <div class="logo">🍳 CocinaNova</div>
  <p>Todo para una cocina práctica</p>
</header>

<section class="hero">
  <h1>Productos para tu cocina</h1>
  <p>Calidad, practicidad y excelentes precios en México.</p>

  <input
    type="text"
    id="search"
    class="search"
    placeholder="Buscar un producto..."
    onkeyup="buscarProducto()"
  >
</section>

<main class="container">
  <div class="products" id="products"></div>
</main>

<button class="cart-button" onclick="abrirCarrito()">
  🛒 Carrito (<span id="cartCount">0</span>)
</button>

<div class="cart" id="cart">
  <div class="cart-box">
    <button class="close" onclick="cerrarCarrito()">Cerrar ✕</button>

    <h2>🛒 Mi carrito</h2>

    <div id="cartItems"></div>

    <div class="total">
      Total: $<span id="cartTotal">0</span> MXN
    </div>

    <a
      id="whatsapp"
      class="whatsapp"
      target="_blank"
      href="#"
    >
      📲 Comprar por WhatsApp
    </a>
  </div>
</div>

<footer>
  <h3>CocinaNova</h3>
  <p>Productos de cocina para tu hogar.</p>
  <br>
  <p>WhatsApp: <a href="https://wa.me/525516490617" target="_blank">
    +52 55 1649 0617
  </a></p>
</footer>

<script>

const productos = [

{
id:1,
nombre:"Set 12 Utensilios de Silicona",
precio:199,
stock:20,
emoji:"🥄",
descripcion:"Set práctico de utensilios de silicona para cocinar."
},

{
id:2,
nombre:"Set 34 Utensilios de Cocina",
precio:299,
stock:20,
emoji:"🍴",
descripcion:"Completo juego de utensilios para tu cocina."
},

{
id:3,
nombre:"Rallador y Cortador 8 Cuchillas",
precio:199,
stock:20,
emoji:"🥕",
descripcion:"Ralla y corta verduras de forma rápida y sencilla."
},

{
id:4,
nombre:"Escurridor de Trastes 2 Niveles",
precio:299,
stock:20,
emoji:"🍽️",
descripcion:"Organiza tus platos y utensilios ahorrando espacio."
},

{
id:5,
nombre:"Juego de Sartenes Antiadherentes",
precio:499,
stock:20,
emoji:"🍳",
descripcion:"Sartenes prácticas para cocinar todos los días."
},

{
id:6,
nombre:"Báscula Digital de Cocina",
precio:249,
stock:20,
emoji:"⚖️",
descripcion:"Ideal para medir ingredientes con precisión."
},

{
id:7,
nombre:"Tijeras de Cocina Multiusos",
precio:129,
stock:20,
emoji:"✂️",
descripcion:"Tijeras resistentes para diferentes tareas de cocina."
},

{
id:8,
nombre:"Set de Utensilios de Bambú",
precio:149,
stock:20,
emoji:"🥢",
descripcion:"Utensilios de bambú elegantes y prácticos."
},

{
id:9,
nombre:"Mezcladora para Fregadero",
precio:249,
stock:20,
emoji:"🚰",
descripcion:"Mezcladora práctica para tu fregadero."
},

{
id:10,
nombre:"Grifo de Cocina Extraíble",
precio:299,
stock:20,
emoji:"🚿",
descripcion:"Grifo moderno con manguera extraíble."
}

];

let carrito=[];

function mostrarProductos(lista=productos){

const contenedor=document.getElementById("products");

contenedor.innerHTML="";

lista.forEach(producto=>{

contenedor.innerHTML+=`

<div class="product">

<div class="product-image">
${producto.emoji}
</div>

<h3>${producto.nombre}</h3>

<p class="description">
${producto.descripcion}
</p>

<div class="price">
$${producto.precio} MXN
</div>

<div class="stock">
📦 Stock disponible: ${producto.stock}
</div>

<button class="add" onclick="agregar(${producto.id})">
🛒 Agregar al carrito
</button>

</div>

`;

});

}

function agregar(id){

const producto=productos.find(p=>p.id===id);

if(!producto) return;

if(producto.stock<=0){
alert("Producto agotado");
return;
}

carrito.push(producto);

producto.stock--;

actualizarCarrito();

mostrarProductos();

alert("Producto agregado al carrito ✅");

}

function actualizarCarrito(){

document.getElementById("cartCount").innerText=carrito.length;

const items=document.getElementById("cartItems");

items.innerHTML="";

let total=0;

carrito.forEach((producto,index)=>{

total+=producto.precio;

items.innerHTML+=`

<div class="cart-item">

<strong>${producto.nombre}</strong>

<br>

$${producto.precio} MXN

<button
onclick="eliminar(${index})"
style="background:#e53935;color:white;padding:5px 8px;border-radius:5px;margin-left:10px;"
>
Eliminar
</button>

</div>

`;

});

document.getElementById("cartTotal").innerText=total;

let mensaje="Hola, quiero comprar:%0A%0A";

carrito.forEach(producto=>{
mensaje+=
"• "+producto.nombre+
" - $"+producto.precio+
" MXN%0A";
});

mensaje+="%0ATotal: $"+total+" MXN";

document.getElementById("whatsapp").href=
"https://wa.me/525516490617?text="+mensaje;

}

function eliminar(index){

const producto=carrito[index];

producto.stock++;

carrito.splice(index,1);

actualizarCarrito();

mostrarProductos();

}

function abrirCarrito(){

document.getElementById("cart").style.display="block";

}

function cerrarCarrito(){

document.getElementById("cart").style.display="none";

}

function buscarProducto(){

const texto=document
.getElementById("search")
.value
.toLowerCase();

const resultados=productos.filter(producto=>
producto.nombre.toLowerCase().includes(texto)
);

mostrarProductos(resultados);

}

mostrarProductos();

</script>

</body>
</html>
